<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="980" viewBox="0 0 1360 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowOpen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="1360" height="980" fill="#ffffff"/>
  <text x="680" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Diagrama de Casos de Uso UML · Sistema de Asistencia Biométrica (SAB)</text>

  <!-- Frontera del sistema -->
  <rect x="230" y="55" width="900" height="895" rx="12" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="680" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Sistema de Asistencia Biométrica (SAB)</text>

  <!-- Helper macro-like actor stick figures -->
  <!-- Aprendiz (left top) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="95" cy="185" r="16" fill="#e0f2fe"/>
    <line x1="95" y1="201" x2="95" y2="245"/>
    <line x1="68" y1="218" x2="122" y2="218"/>
    <line x1="95" y1="245" x2="72" y2="275"/>
    <line x1="95" y1="245" x2="118" y2="275"/>
  </g>
  <text x="95" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Aprendiz</text>
  <text x="95" y="312" text-anchor="middle" font-size="11" fill="#475569">(Actor primario)</text>

  <!-- Instructor lider (left middle) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="95" cy="455" r="16" fill="#dcfce7"/>
    <line x1="95" y1="471" x2="95" y2="515"/>
    <line x1="68" y1="488" x2="122" y2="488"/>
    <line x1="95" y1="515" x2="72" y2="545"/>
    <line x1="95" y1="515" x2="118" y2="545"/>
  </g>
  <text x="95" y="565" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Instructor líder</text>
  <text x="95" y="582" text-anchor="middle" font-size="11" fill="#475569">(Actor primario)</text>

  <!-- Coordinador (left lower) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="95" cy="675" r="16" fill="#fef9c3"/>
    <line x1="95" y1="691" x2="95" y2="735"/>
    <line x1="68" y1="708" x2="122" y2="708"/>
    <line x1="95" y1="735" x2="72" y2="765"/>
    <line x1="95" y1="735" x2="118" y2="765"/>
  </g>
  <text x="95" y="785" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Coordinador</text>
  <text x="95" y="802" text-anchor="middle" font-size="11" fill="#475569">(Actor primario)</text>

  <!-- Administrador (left bottom) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <circle cx="95" cy="845" r="16" fill="#ede9fe"/>
    <line x1="95" y1="861" x2="95" y2="900"/>
    <line x1="68" y1="875" x2="122" y2="875"/>
    <line x1="95" y1="900" x2="72" y2="928"/>
    <line x1="95" y1="900" x2="118" y2="928"/>
  </g>
  <text x="95" y="947" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Administrador</text>
  <text x="95" y="964" text-anchor="middle" font-size="11" fill="#475569">(Actor primario)</text>

  <!-- Servicio biometrico (right) -->
  <g stroke="#0f172a" stroke-width="2" fill="none">
    <rect x="1180" y="210" width="145" height="72" rx="8" fill="#ffe4e6" stroke="#9f1239"/>
    <text x="1252" y="236" text-anchor="middle" font-size="11" fill="#9f1239" stroke="none">&lt;&lt;actor secundario&gt;&gt;</text>
    <text x="1252" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" stroke="none">Servicio</text>
    <text x="1252" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" stroke="none">biométrico</text>
  </g>

  <!-- Casos de uso Columna 1 (cx=440) -->
  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8">
    <ellipse cx="440" cy="128" rx="145" ry="26"/>
    <ellipse cx="440" cy="198" rx="155" ry="26"/>
    <ellipse cx="440" cy="272" rx="150" ry="26"/>
    <ellipse cx="440" cy="346" rx="150" ry="26"/>
    <ellipse cx="440" cy="420" rx="150" ry="26"/>
    <ellipse cx="440" cy="494" rx="150" ry="26"/>
    <ellipse cx="440" cy="568" rx="155" ry="26"/>
    <ellipse cx="440" cy="642" rx="150" ry="26"/>
    <ellipse cx="440" cy="716" rx="155" ry="26"/>
    <ellipse cx="440" cy="792" rx="155" ry="26"/>
    <ellipse cx="440" cy="870" rx="155" ry="26"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="440" y="133">CU-01 Iniciar sesión</text>
    <text x="440" y="203">CU-08 Registrar asistencia ordinaria</text>
    <text x="440" y="277">CU-04 Enrolar huella biométrica</text>
    <text x="440" y="351">CU-13 Enviar excusa con soporte</text>
    <text x="440" y="425">CU-17 Consultar historial propio</text>
    <text x="440" y="499">CU-05 Abrir sesión de asistencia</text>
    <text x="440" y="573">CU-10 Cerrar sesión y exportar reporte</text>
    <text x="440" y="647">CU-03 Registrar aprendiz en ficha</text>
    <text x="440" y="721">CU-15 Consultar reportes consolidados</text>
    <text x="440" y="797">CU-02 Administrar fichas y liderazgo</text>
    <text x="440" y="875">CU-18 Eliminar biometría al egreso</text>
  </g>

  <!-- Casos de uso Columna 2 (cx=910) -->
  <g fill="#ffffff" stroke="#0f766e" stroke-width="1.8">
    <ellipse cx="910" cy="160" rx="150" ry="26"/>
    <ellipse cx="910" cy="245" rx="145" ry="26"/>
    <ellipse cx="910" cy="335" rx="150" ry="26"/>
    <ellipse cx="910" cy="425" rx="155" ry="26"/>
    <ellipse cx="910" cy="515" rx="155" ry="26"/>
    <ellipse cx="910" cy="610" rx="150" ry="26"/>
    <ellipse cx="910" cy="792" rx="145" ry="26"/>
  </g>
  <g font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="910" y="165">CU-06 Verificar huella biométrica</text>
    <text x="910" y="250">CU-07 Escanear código QR</text>
    <text x="910" y="340">CU-09 Escalar intento sospechoso</text>
    <text x="910" y="430">CU-11 Registrar asistencia manual</text>
    <text x="910" y="520">CU-12 Cancelar sesión por contingencia</text>
    <text x="910" y="615">CU-14 Confirmar recepción de excusa</text>
    <text x="910" y="797">CU-16 Reasignar líder de ficha</text>
  </g>

  <!-- Asociaciones Actores Primarios -> Casos de Uso -->
  <g stroke="#334155" stroke-width="1.5">
    <!-- Aprendiz (122,225) -->
    <line x1="122" y1="212" x2="295" y2="132"/>
    <line x1="122" y1="220" x2="285" y2="198"/>
    <line x1="122" y1="228" x2="290" y2="272"/>
    <line x1="122" y1="235" x2="290" y2="346"/>
    <line x1="122" y1="242" x2="290" y2="418"/>
    <!-- Instructor lider (122,495) -->
    <line x1="122" y1="470" x2="295" y2="140"/>
    <line x1="122" y1="480" x2="290" y2="278"/>
    <line x1="122" y1="486" x2="290" y2="424"/>
    <line x1="122" y1="494" x2="290" y2="494"/>
    <line x1="122" y1="502" x2="285" y2="568"/>
    <line x1="122" y1="510" x2="290" y2="642"/>
    <!-- Instructor -> CU-09, CU-11, CU-12, CU-14 (rutas por debajo o laterales limpias) -->
    <polyline points="122,490 205,490 205,922 715,922 715,335 760,335" fill="none" stroke="#64748b"/>
    <line x1="715" y1="610" x2="760" y2="610" stroke="#64748b"/>
    <line x1="715" y1="515" x2="755" y2="515" stroke="#64748b"/>
    <line x1="715" y1="425" x2="755" y2="425" stroke="#64748b"/>
    <line x1="715" y1="335" x2="760" y2="335" stroke="#64748b"/>

    <!-- Coordinador (122,715) -->
    <line x1="122" y1="700" x2="295" y2="145"/>
    <line x1="122" y1="716" x2="285" y2="716"/>

    <!-- Administrador (122,880) -->
    <line x1="122" y1="860" x2="295" y2="148"/>
    <line x1="122" y1="875" x2="285" y2="792"/>
    <line x1="122" y1="885" x2="285" y2="870"/>

    <!-- Servicio biometrico (1180, 246) -->
    <line x1="1060" y1="160" x2="1180" y2="232"/>
    <polyline points="590,272 670,272 670,285 1105,285 1180,256" fill="none"/>
    <polyline points="595,870 1105,870 1105,270 1180,270" fill="none"/>
  </g>

  <!-- Relaciones include y extend -->
  <!-- CU-08 include CU-06 -->
  <line x1="595" y1="190" x2="758" y2="164" stroke="#1e293b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="678" y="166" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-08 include CU-07 -->
  <line x1="595" y1="208" x2="764" y2="242" stroke="#1e293b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="678" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">&lt;&lt;include&gt;&gt;</text>

  <!-- CU-09 extend CU-06 -->
  <polyline points="1060,335 1090,335 1090,175 1062,175" fill="none" stroke="#9f1239" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="1040" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">&lt;&lt;extend&gt;&gt;</text>
  <text x="1040" y="308" text-anchor="middle" font-size="9.5" fill="#475569">[intentos &gt;= 3]</text>

  <!-- CU-11 extend CU-08 -->
  <line x1="762" y1="414" x2="565" y2="220" stroke="#9f1239" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="682" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">&lt;&lt;extend&gt;&gt;</text>
  <text x="682" y="384" text-anchor="middle" font-size="9.5" fill="#475569">[fallo lector/red]</text>

  <!-- CU-12 extend CU-05 -->
  <line x1="755" y1="512" x2="592" y2="496" stroke="#9f1239" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="675" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">&lt;&lt;extend&gt;&gt;</text>
  <text x="675" y="530" text-anchor="middle" font-size="9.5" fill="#475569">[contingencia]</text>

  <!-- CU-16 extend CU-02 -->
  <line x1="765" y1="792" x2="598" y2="792" stroke="#9f1239" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrowOpen)"/>
  <text x="680" y="782" text-anchor="middle" font-size="11" font-weight="700" fill="#9f1239">&lt;&lt;extend&gt;&gt;</text>
  <text x="680" y="808" text-anchor="middle" font-size="9.5" fill="#475569">[cambio líder]</text>
</svg>


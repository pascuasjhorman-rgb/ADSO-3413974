<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="860" viewBox="0 0 1220 860" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#1e293b"/>
    </marker>
  </defs>
  <rect width="1220" height="860" fill="#ffffff"/>
  <text x="610" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Diagrama de Actividades UML · CU-08 Registrar asistencia ordinaria</text>

  <!-- Swimlanes -->
  <rect x="30" y="50" width="380" height="780" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <rect x="410" y="50" width="460" height="780" fill="#f0fdf4" stroke="#475569" stroke-width="1.8"/>
  <rect x="870" y="50" width="320" height="780" fill="#fff1f2" stroke="#475569" stroke-width="1.8"/>
  <rect x="30" y="50" width="380" height="36" fill="#e2e8f0" stroke="#475569"/>
  <rect x="410" y="50" width="460" height="36" fill="#dcfce7" stroke="#475569"/>
  <rect x="870" y="50" width="320" height="36" fill="#ffe4e6" stroke="#475569"/>
  <text x="220" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Aprendiz</text>
  <text x="640" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Sistema SAB</text>
  <text x="1030" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Servicio biométrico</text>

  <!-- Start node -->
  <circle cx="220" cy="120" r="12" fill="#0f172a"/>
  <line x1="220" y1="132" x2="220" y2="156" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Action 1: Seleccionar sesion -->
  <rect x="105" y="158" width="230" height="44" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="220" y="185" text-anchor="middle" font-size="12.5" font-weight="600">Seleccionar sesión activa</text>

  <!-- Arrow to Sistema: Verificar previa -->
  <polyline points="335,180 480,180" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Decision 1: Asistencia previa? -->
  <polygon points="560,152 630,180 560,208 490,180" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
  <text x="560" y="184" text-anchor="middle" font-size="11" font-weight="700">¿Previa?</text>

  <!-- [ya existe] -->
  <polyline points="630,180 740,180 740,218" fill="none" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="685" y="172" text-anchor="middle" font-size="10.5" fill="#9f1239">[ya existe]</text>
  <rect x="655" y="220" width="170" height="40" rx="10" fill="#fee2e2" stroke="#9f1239" stroke-width="1.6"/>
  <text x="740" y="245" text-anchor="middle" font-size="11.5" font-weight="600">Informar duplicado</text>
  <line x1="740" y1="260" x2="740" y2="288" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="740" cy="302" r="11" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="740" cy="302" r="6" fill="#0f172a"/>

  <!-- [sin asistencia previa] -->
  <line x1="560" y1="208" x2="560" y2="262" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="488" y="238" text-anchor="middle" font-size="10.5" fill="#065f46">[sin registro previo]</text>

  <!-- Capturar huella (Aprendiz) -->
  <rect x="105" y="264" width="230" height="44" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="220" y="291" text-anchor="middle" font-size="12.5" font-weight="600">Capturar muestra de huella</text>
  <line x1="490" y1="286" x2="337" y2="286" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="490" y="264" width="140" height="44" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="560" y="290" text-anchor="middle" font-size="12" font-weight="600">Solicitar huella</text>

  <!-- Aprendiz -> Servicio biometrico -->
  <polyline points="220,308 220,342 925,342" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="927" y="320" width="210" height="44" rx="12" fill="#ffffff" stroke="#9f1239" stroke-width="1.8"/>
  <text x="1032" y="346" text-anchor="middle" font-size="12.5" font-weight="600">Cotejar plantilla biométrica</text>

  <!-- Servicio -> Sistema Decision Huella -->
  <polyline points="1032,364 1032,374 560,374 560,380" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <polygon points="560,382 630,412 560,442 490,412" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
  <text x="560" y="416" text-anchor="middle" font-size="11" font-weight="700">¿Coincide?</text>

  <!-- [no coincide] -> contar intento -->
  <line x1="630" y1="412" x2="700" y2="412" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="665" y="404" text-anchor="middle" font-size="10.5" fill="#9f1239">[no]</text>
  <rect x="702" y="390" width="148" height="44" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="776" y="416" text-anchor="middle" font-size="11.5" font-weight="600">Sumar intento</text>
  <line x1="776" y1="434" x2="776" y2="472" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Decision intentos -->
  <polygon points="776,474 844,504 776,534 708,504" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
  <text x="776" y="508" text-anchor="middle" font-size="10.5" font-weight="700">¿Intentos?</text>
  <!-- [intentos < 3] loop back -->
  <polyline points="776,474 776,456 390,456 390,295 337,295" fill="none" stroke="#1e293b" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="680" y="450" text-anchor="middle" font-size="10" fill="#065f46">[intentos &lt; 3]</text>

  <!-- [intentos >= 3] -> incidencia y fin -->
  <line x1="776" y1="534" x2="776" y2="574" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="822" y="556" text-anchor="middle" font-size="10.5" fill="#9f1239">[&gt;= 3]</text>
  <rect x="696" y="576" width="160" height="46" rx="10" fill="#fee2e2" stroke="#9f1239" stroke-width="1.6"/>
  <text x="776" y="596" text-anchor="middle" font-size="11.5" font-weight="600">Generar incidencia</text>
  <text x="776" y="612" text-anchor="middle" font-size="11">y bloquear flujo</text>
  <line x1="776" y1="622" x2="776" y2="652" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="776" cy="666" r="11" fill="none" stroke="#0f172a" stroke-width="2"/>
  <circle cx="776" cy="666" r="6" fill="#0f172a"/>

  <!-- [si coincide] -> habilitar QR -->
  <line x1="560" y1="442" x2="560" y2="486" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="520" y="468" text-anchor="middle" font-size="10.5" fill="#065f46">[sí coincide]</text>
  <rect x="465" y="488" width="190" height="44" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="560" y="514" text-anchor="middle" font-size="12" font-weight="600">Habilitar lectura QR (10 s)</text>

  <!-- Aprendiz escanea QR -->
  <line x1="465" y1="510" x2="337" y2="510" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="105" y="488" width="230" height="44" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="220" y="514" text-anchor="middle" font-size="12.5" font-weight="600">Escanear código QR vigente</text>

  <!-- Aprendiz -> Validar QR -->
  <polyline points="220,532 220,594 488,594" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <polygon points="560,564 630,594 560,624 490,594" fill="#fef9c3" stroke="#a16207" stroke-width="1.8"/>
  <text x="560" y="598" text-anchor="middle" font-size="11" font-weight="700">¿QR válido?</text>

  <!-- [QR vencido] -> sumar intento -->
  <polyline points="630,594 674,594 674,424 700,424" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="664" y="556" text-anchor="middle" font-size="10" fill="#9f1239">[vencido/</text>
  <text x="664" y="568" text-anchor="middle" font-size="10" fill="#9f1239">inválido]</text>

  <!-- [QR valido] -> Guardar asistencia y auditoria -->
  <line x1="560" y1="624" x2="560" y2="668" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="502" y="650" text-anchor="middle" font-size="10.5" fill="#065f46">[válido en ventana]</text>
  <rect x="445" y="670" width="230" height="48" rx="12" fill="#dcfce7" stroke="#0f766e" stroke-width="1.8"/>
  <text x="560" y="692" text-anchor="middle" font-size="12" font-weight="700">Registrar asistencia y auditoría</text>
  <text x="560" y="708" text-anchor="middle" font-size="11">(origen: Ordinaria)</text>

  <!-- Confirmar a Aprendiz y Fin -->
  <line x1="445" y1="694" x2="337" y2="694" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="105" y="672" width="230" height="44" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="220" y="699" text-anchor="middle" font-size="12.5" font-weight="600">Visualizar confirmación</text>
  <line x1="220" y1="716" x2="220" y2="758" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr)"/>
  <circle cx="220" cy="774" r="13" fill="none" stroke="#0f172a" stroke-width="2.2"/>
  <circle cx="220" cy="774" r="7" fill="#0f172a"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1360" height="920" fill="#ffffff"/>
  <text x="680" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Modelo Entidad-Relación (MER) · Notación Pata de Gallo · SAB</text>
  <text x="680" y="52" text-anchor="middle" font-size="12" fill="#475569">PK = Clave primaria · [Asociativa] = N:M resuelta · [Débil] = Existencia dependiente · Cardinalidad mín/máx indicada</text>

  <!-- Entities -->
  <!-- SEDE -->
  <rect x="40" y="85" width="210" height="105" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="40" y="85" width="210" height="28" fill="#1d4ed8"/>
  <text x="145" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SEDE</text>
  <text x="52" y="130" font-size="11.5" font-weight="700">PK id_sede</text>
  <text x="52" y="148" font-size="11.5">nombre_sede (UK)</text>
  <text x="52" y="166" font-size="11.5">ciudad</text>
  <text x="52" y="182" font-size="11.5">estado</text>

  <!-- FICHA -->
  <rect x="360" y="80" width="235" height="122" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="360" y="80" width="235" height="28" fill="#1d4ed8"/>
  <text x="477" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">FICHA</text>
  <text x="372" y="125" font-size="11.5" font-weight="700">PK id_ficha</text>
  <text x="372" y="143" font-size="11.5">FK id_sede, id_lider</text>
  <text x="372" y="161" font-size="11.5">codigo_ficha (UK)</text>
  <text x="372" y="179" font-size="11.5">programa, jornada</text>
  <text x="372" y="195" font-size="11.5">estado</text>

  <!-- VINCULACION_FICHA (Asociativa N:M con atributos propios) -->
  <rect x="705" y="80" width="265" height="126" rx="4" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <rect x="705" y="80" width="265" height="28" fill="#a16207"/>
  <text x="837" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">VINCULACION_FICHA [Asociativa]</text>
  <text x="717" y="125" font-size="11.5" font-weight="700">PK id_vinculacion</text>
  <text x="717" y="143" font-size="11.5">FK id_ficha, id_usuario</text>
  <text x="717" y="161" font-size="11.5">rol_en_ficha</text>
  <text x="717" y="179" font-size="11.5">fecha_vinculacion, fecha_retiro</text>
  <text x="717" y="196" font-size="11.5">estado_vinculacion</text>

  <!-- USUARIO -->
  <rect x="1080" y="80" width="240" height="136" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="1080" y="80" width="240" height="28" fill="#1d4ed8"/>
  <text x="1200" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">USUARIO</text>
  <text x="1092" y="125" font-size="11.5" font-weight="700">PK id_usuario</text>
  <text x="1092" y="143" font-size="11.5">documento (UK)</text>
  <text x="1092" y="161" font-size="11.5">correo (UK), clave_hash</text>
  <text x="1092" y="179" font-size="11.5">nombre_completo, rol</text>
  <text x="1092" y="197" font-size="11.5">estado, ultimo_acceso</text>

  <!-- PLANTILLA_BIOMETRICA (Debil) -->
  <rect x="1080" y="310" width="240" height="122" rx="4" fill="#fff1f2" stroke="#9f1239" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="1080" y="310" width="240" height="28" fill="#9f1239"/>
  <text x="1200" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PLANTILLA_BIOMETRICA [Débil]</text>
  <text x="1092" y="355" font-size="11.5" font-weight="700">PK id_plantilla</text>
  <text x="1092" y="373" font-size="11.5">FK id_usuario (UK)</text>
  <text x="1092" y="391" font-size="11.5">referencia_protegida</text>
  <text x="1092" y="409" font-size="11.5">acepta_tratamiento, fecha_acepta</text>
  <text x="1092" y="425" font-size="11.5">estado_vigencia</text>

  <!-- SESION_FORMACION -->
  <rect x="360" y="320" width="250" height="136" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="360" y="320" width="250" height="28" fill="#1d4ed8"/>
  <text x="485" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SESION_FORMACION</text>
  <text x="372" y="365" font-size="11.5" font-weight="700">PK id_sesion</text>
  <text x="372" y="383" font-size="11.5">FK id_ficha, id_instructor</text>
  <text x="372" y="401" font-size="11.5">fecha_apertura, fecha_cierre</text>
  <text x="372" y="419" font-size="11.5">estado_sesion</text>
  <text x="372" y="437" font-size="11.5">motivo_contingencia, soporte</text>

  <!-- TOKEN_QR (Debil) -->
  <rect x="40" y="325" width="225" height="122" rx="4" fill="#f0fdf4" stroke="#0f766e" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="40" y="325" width="225" height="28" fill="#0f766e"/>
  <text x="152" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">TOKEN_QR [Débil]</text>
  <text x="52" y="370" font-size="11.5" font-weight="700">PK id_token</text>
  <text x="52" y="388" font-size="11.5">FK id_sesion</text>
  <text x="52" y="406" font-size="11.5">codigo_firma (UK)</text>
  <text x="52" y="424" font-size="11.5">emitido_en, expira_en</text>
  <text x="52" y="440" font-size="11.5">estado_token</text>

  <!-- ASISTENCIA -->
  <rect x="190" y="575" width="250" height="136" rx="4" fill="#dcfce7" stroke="#0f766e" stroke-width="2"/>
  <rect x="190" y="575" width="250" height="28" fill="#0f766e"/>
  <text x="315" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ASISTENCIA</text>
  <text x="202" y="620" font-size="11.5" font-weight="700">PK id_asistencia</text>
  <text x="202" y="638" font-size="11.5">FK id_sesion, id_aprendiz (UK par)</text>
  <text x="202" y="656" font-size="11.5">estado_asistencia</text>
  <text x="202" y="674" font-size="11.5">origen_registro (Ordinaria/Manual)</text>
  <text x="202" y="692" font-size="11.5">marca_tiempo, motivo_manual</text>

  <!-- INCIDENCIA -->
  <rect x="520" y="575" width="250" height="136" rx="4" fill="#fff1f2" stroke="#9f1239" stroke-width="2"/>
  <rect x="520" y="575" width="250" height="28" fill="#9f1239"/>
  <text x="645" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INCIDENCIA</text>
  <text x="532" y="620" font-size="11.5" font-weight="700">PK id_incidencia</text>
  <text x="532" y="638" font-size="11.5">FK id_sesion, id_aprendiz</text>
  <text x="532" y="656" font-size="11.5">tipo_incidencia, intentos_fallidos</text>
  <text x="532" y="674" font-size="11.5">estado_resolucion</text>
  <text x="532" y="692" font-size="11.5">resuelta_por, fecha_resolucion</text>

  <!-- EXCUSA -->
  <rect x="840" y="575" width="250" height="136" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="840" y="575" width="250" height="28" fill="#1d4ed8"/>
  <text x="965" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EXCUSA</text>
  <text x="852" y="620" font-size="11.5" font-weight="700">PK id_excusa</text>
  <text x="852" y="638" font-size="11.5">FK id_aprendiz, id_sesion</text>
  <text x="852" y="656" font-size="11.5">tipo_excusa, descripcion</text>
  <text x="852" y="674" font-size="11.5">ruta_soporte, estado_recepcion</text>
  <text x="852" y="692" font-size="11.5">fecha_confirmacion</text>

  <!-- BITACORA_AUDITORIA -->
  <rect x="1080" y="755" width="240" height="122" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <rect x="1080" y="755" width="240" height="28" fill="#334155"/>
  <text x="1200" y="774" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">BITACORA_AUDITORIA</text>
  <text x="1092" y="800" font-size="11.5" font-weight="700">PK id_auditoria</text>
  <text x="1092" y="818" font-size="11.5">FK id_actor</text>
  <text x="1092" y="836" font-size="11.5">entidad_recurso, operacion</text>
  <text x="1092" y="854" font-size="11.5">valor_anterior, valor_nuevo</text>
  <text x="1092" y="870" font-size="11.5">fecha_evento, resultado</text>

  <!-- Relationships with Crow's Foot notation markers -->
  <g stroke="#1e293b" stroke-width="1.8" fill="none">
    <!-- SEDE (1,1) a (0,N) FICHA -->
    <line x1="250" y1="138" x2="360" y2="138"/>
    <line x1="262" y1="130" x2="262" y2="146"/><line x1="270" y1="130" x2="270" y2="146"/>
    <circle cx="338" cy="138" r="5" fill="#ffffff"/>
    <line x1="344" y1="138" x2="360" y2="130"/><line x1="344" y1="138" x2="360" y2="146"/>

    <!-- FICHA (1,1) a (1,N) VINCULACION_FICHA -->
    <line x1="595" y1="138" x2="705" y2="138"/>
    <line x1="607" y1="130" x2="607" y2="146"/><line x1="615" y1="130" x2="615" y2="146"/>
    <line x1="686" y1="130" x2="686" y2="146"/>
    <line x1="688" y1="138" x2="705" y2="130"/><line x1="688" y1="138" x2="705" y2="146"/>

    <!-- VINCULACION_FICHA (0,N) a (1,1) USUARIO -->
    <line x1="970" y1="138" x2="1080" y2="138"/>
    <circle cx="992" cy="138" r="5" fill="#ffffff"/>
    <line x1="986" y1="138" x2="970" y2="130"/><line x1="986" y1="138" x2="970" y2="146"/>
    <line x1="1062" y1="130" x2="1062" y2="146"/><line x1="1070" y1="130" x2="1070" y2="146"/>

    <!-- USUARIO (1,1) a (0,1) PLANTILLA_BIOMETRICA -->
    <line x1="1200" y1="216" x2="1200" y2="310"/>
    <line x1="1192" y1="228" x2="1208" y2="228"/><line x1="1192" y1="236" x2="1208" y2="236"/>
    <circle cx="1200" cy="292" r="5" fill="#ffffff"/>
    <line x1="1192" y1="302" x2="1208" y2="302"/>

    <!-- FICHA (1,1) a (0,N) SESION_FORMACION -->
    <line x1="485" y1="202" x2="485" y2="320"/>
    <line x1="477" y1="214" x2="493" y2="214"/><line x1="477" y1="222" x2="493" y2="222"/>
    <circle cx="485" cy="298" r="5" fill="#ffffff"/>
    <line x1="485" y1="304" x2="477" y2="320"/><line x1="485" y1="304" x2="493" y2="320"/>

    <!-- SESION_FORMACION (1,1) a (1,N) TOKEN_QR -->
    <line x1="265" y1="386" x2="360" y2="386"/>
    <line x1="342" y1="378" x2="342" y2="394"/><line x1="350" y1="378" x2="350" y2="394"/>
    <line x1="283" y1="378" x2="283" y2="394"/>
    <line x1="281" y1="386" x2="265" y2="378"/><line x1="281" y1="386" x2="265" y2="394"/>

    <!-- SESION_FORMACION a ASISTENCIA / INCIDENCIA / EXCUSA -->
    <polyline points="420,456 420,515 315,515 315,575"/>
    <polyline points="485,456 485,515 645,515 645,575"/>
    <polyline points="550,456 550,515 965,515 965,575"/>

    <!-- USUARIO a ASISTENCIA / INCIDENCIA / EXCUSA / BITACORA -->
    <polyline points="1115,216 1115,250 1050,250 1050,730 315,730 315,711"/>
    <line x1="645" y1="730" x2="645" y2="711"/>
    <line x1="965" y1="730" x2="965" y2="711"/>
    <line x1="1200" y1="432" x2="1200" y2="755" stroke-dasharray="3,0"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#334155">
    <text x="305" y="124" text-anchor="middle">1..1 : 0..N</text>
    <text x="650" y="124" text-anchor="middle">1..1 : 1..N</text>
    <text x="1025" y="124" text-anchor="middle">0..N : 1..1</text>
    <text x="1242" y="268" text-anchor="middle">1..1 : 0..1</text>
    <text x="520" y="265" text-anchor="middle">1..1 : 0..N</text>
    <text x="312" y="372" text-anchor="middle">1..N : 1..1</text>
    <text x="348" y="545">0..N</text><text x="655" y="545">0..N</text><text x="975" y="545">0..N</text>
    <text x="1238" y="610">0..N auditoría</text>
  </g>
</svg>



<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="inh" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <polygon points="2,2 12,7 2,12" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1e293b" stroke-width="1.6"/>
    </marker>
    <marker id="comp" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="0,5 7,1 14,5 7,9" fill="#1e293b"/>
    </marker>
    <marker id="agg" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="0,5 7,1 14,5 7,9" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1480" height="1000" fill="#ffffff"/>
  <text x="740" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Diagrama de Clases de Diseño UML · Patrones Strategy y Facade · SAB</text>

  <!-- Usuario -->
  <rect x="40" y="60" width="245" height="145" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="40" y1="88" x2="285" y2="88" stroke="#1d4ed8"/><line x1="40" y1="166" x2="285" y2="166" stroke="#1d4ed8"/>
  <text x="162" y="79" text-anchor="middle" font-size="13" font-weight="700">Usuario</text>
  <text x="48" y="105" font-size="10.5">-idUsuario: int</text>
  <text x="48" y="120" font-size="10.5">-documento: str</text>
  <text x="48" y="135" font-size="10.5">-claveHash: str</text>
  <text x="48" y="150" font-size="10.5">-rol: str | -activo: bool</text>
  <text x="48" y="182" font-size="10.5">+autenticar(clave: str): bool</text>
  <text x="48" y="197" font-size="10.5">+desactivar(): void</text>

  <!-- Aprendiz -->
  <rect x="30" y="255" width="245" height="118" fill="#f0fdf4" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="30" y1="283" x2="275" y2="283" stroke="#0f766e"/><line x1="30" y1="326" x2="275" y2="326" stroke="#0f766e"/>
  <text x="152" y="274" text-anchor="middle" font-size="13" font-weight="700">Aprendiz</text>
  <text x="38" y="300" font-size="10.5">-codigoMatricula: str</text>
  <text x="38" y="314" font-size="10.5">-estadoAcademico: str</text>
  <text x="38" y="344" font-size="10.5">+solicitarAsistencia(idSes: int): void</text>
  <text x="38" y="360" font-size="10.5">+radicarExcusa(idSes: int, m: str): Excusa</text>

  <!-- Instructor -->
  <rect x="295" y="255" width="315" height="118" fill="#f0fdf4" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="295" y1="283" x2="610" y2="283" stroke="#0f766e"/><line x1="295" y1="326" x2="610" y2="326" stroke="#0f766e"/>
  <text x="452" y="274" text-anchor="middle" font-size="13" font-weight="700">Instructor</text>
  <text x="303" y="300" font-size="10.5">-especialidad: str</text>
  <text x="303" y="314" font-size="10.5">-esLider: bool</text>
  <text x="303" y="344" font-size="10.5">+abrirSesion(idFicha: int): SesionFormacion</text>
  <text x="303" y="360" font-size="10.5">+registrarManual(idS: int, idA: int, mot: str): RegistroAsistencia</text>

  <!-- Ficha -->
  <rect x="315" y="60" width="245" height="134" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="315" y1="88" x2="560" y2="88" stroke="#1d4ed8"/><line x1="315" y1="152" x2="560" y2="152" stroke="#1d4ed8"/>
  <text x="437" y="79" text-anchor="middle" font-size="13" font-weight="700">Ficha</text>
  <text x="323" y="105" font-size="10.5">-idFicha: int</text>
  <text x="323" y="120" font-size="10.5">-codigoFicha: str</text>
  <text x="323" y="135" font-size="10.5">-programa: str | -estado: str</text>
  <text x="323" y="168" font-size="10.5">+asignarLider(inst: Instructor): void</text>
  <text x="323" y="183" font-size="10.5">+vincularAprendiz(apr: Aprendiz): void</text>

  <!-- SesionFormacion -->
  <rect x="630" y="60" width="255" height="134" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="630" y1="88" x2="885" y2="88" stroke="#1d4ed8"/><line x1="630" y1="152" x2="885" y2="152" stroke="#1d4ed8"/>
  <text x="757" y="79" text-anchor="middle" font-size="13" font-weight="700">SesionFormacion</text>
  <text x="638" y="105" font-size="10.5">-idSesion: int</text>
  <text x="638" y="120" font-size="10.5">-fechaApertura: datetime</text>
  <text x="638" y="135" font-size="10.5">-fechaCierre: datetime | -estado: str</text>
  <text x="638" y="168" font-size="10.5">+rotarQR(): TokenQR</text>
  <text x="638" y="183" font-size="10.5">+cerrar(): void</text>

  <!-- TokenQR -->
  <rect x="960" y="60" width="235" height="134" fill="#dcfce7" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="960" y1="88" x2="1195" y2="88" stroke="#0f766e"/><line x1="960" y1="160" x2="1195" y2="160" stroke="#0f766e"/>
  <text x="1077" y="79" text-anchor="middle" font-size="13" font-weight="700">TokenQR</text>
  <text x="968" y="105" font-size="10.5">-idToken: int</text>
  <text x="968" y="120" font-size="10.5">-codigoFirma: str</text>
  <text x="968" y="135" font-size="10.5">-emitidoEn: datetime</text>
  <text x="968" y="150" font-size="10.5">-expiraEn: datetime</text>
  <text x="968" y="178" font-size="10.5">+esVigente(ahora: datetime): bool</text>

  <!-- RegistroAsistencia -->
  <rect x="30" y="470" width="250" height="125" fill="#dcfce7" stroke="#0f766e" stroke-width="1.8"/>
  <line x1="30" y1="498" x2="280" y2="498" stroke="#0f766e"/><line x1="30" y1="560" x2="280" y2="560" stroke="#0f766e"/>
  <text x="155" y="489" text-anchor="middle" font-size="13" font-weight="700">RegistroAsistencia</text>
  <text x="38" y="515" font-size="10.5">-idAsistencia: int</text>
  <text x="38" y="529" font-size="10.5">-estado: str | -origen: str</text>
  <text x="38" y="543" font-size="10.5">-marcaTiempo: datetime</text>
  <text x="38" y="578" font-size="10.5">+marcar(origen: str, mot: str): void</text>

  <!-- Incidencia -->
  <rect x="315" y="470" width="255" height="125" fill="#fff1f2" stroke="#9f1239" stroke-width="1.8"/>
  <line x1="315" y1="498" x2="570" y2="498" stroke="#9f1239"/><line x1="315" y1="560" x2="570" y2="560" stroke="#9f1239"/>
  <text x="442" y="489" text-anchor="middle" font-size="13" font-weight="700">Incidencia</text>
  <text x="323" y="515" font-size="10.5">-idIncidencia: int</text>
  <text x="323" y="529" font-size="10.5">-tipo: str | -intentosFallidos: int</text>
  <text x="323" y="543" font-size="10.5">-estado: str</text>
  <text x="323" y="578" font-size="10.5">+resolver(idInst: int, dec: str): void</text>

  <!-- Excusa -->
  <rect x="30" y="650" width="250" height="125" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="30" y1="678" x2="280" y2="678" stroke="#1d4ed8"/><line x1="30" y1="740" x2="280" y2="740" stroke="#1d4ed8"/>
  <text x="155" y="669" text-anchor="middle" font-size="13" font-weight="700">Excusa</text>
  <text x="38" y="695" font-size="10.5">-idExcusa: int</text>
  <text x="38" y="709" font-size="10.5">-tipo: str | -rutaSoporte: str</text>
  <text x="38" y="723" font-size="10.5">-estado: str</text>
  <text x="38" y="758" font-size="10.5">+confirmarRecepcion(idInst: int): void</text>

  <!-- Patron Facade: FachadaAsistenciaSAB -->
  <rect x="630" y="275" width="335" height="130" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <line x1="630" y1="316" x2="965" y2="316" stroke="#a16207"/><line x1="630" y1="358" x2="965" y2="358" stroke="#a16207"/>
  <text x="797" y="294" text-anchor="middle" font-size="10.5" fill="#92400e">&lt;&lt;Facade&gt;&gt;</text>
  <text x="797" y="310" text-anchor="middle" font-size="13" font-weight="700">FachadaAsistenciaSAB</text>
  <text x="638" y="333" font-size="10.5">-biometria: ProveedorBiometrico</text>
  <text x="638" y="348" font-size="10.5">-exportador: ExportadorReporte</text>
  <text x="638" y="376" font-size="10.5">+marcarOrdinaria(idA: int, idS: int, m: bytes, qr: str): Registro</text>
  <text x="638" y="392" font-size="10.5">+cerrarYExportar(idS: int, fmt: str): bytes</text>

  <!-- Patron Strategy 1: ProveedorBiometrico -->
  <rect x="1030" y="265" width="400" height="115" fill="#fff1f2" stroke="#9f1239" stroke-width="2"/>
  <line x1="1030" y1="306" x2="1430" y2="306" stroke="#9f1239"/>
  <text x="1230" y="283" text-anchor="middle" font-size="10.5" fill="#9f1239">&lt;&lt;interface · Strategy&gt;&gt;</text>
  <text x="1230" y="299" text-anchor="middle" font-size="13" font-weight="700">ProveedorBiometrico</text>
  <text x="1040" y="325" font-size="10.5">+enrolar(muestra: bytes): str</text>
  <text x="1040" y="342" font-size="10.5">+cotejar(muestra: bytes, ref: str): bool</text>
  <text x="1040" y="359" font-size="10.5">+suprimir(ref: str): bool</text>

  <rect x="975" y="465" width="225" height="122" fill="#ffffff" stroke="#9f1239" stroke-width="1.6"/>
  <line x1="975" y1="493" x2="1200" y2="493" stroke="#9f1239"/><line x1="975" y1="520" x2="1200" y2="520" stroke="#9f1239"/>
  <text x="1087" y="484" text-anchor="middle" font-size="12" font-weight="700">ProveedorSDKUSB</text>
  <text x="983" y="510" font-size="10.5">-puertoDispositivo: str</text>
  <text x="983" y="538" font-size="10.5">+enrolar(muestra: bytes): str</text>
  <text x="983" y="554" font-size="10.5">+cotejar(m: bytes, ref: str): bool</text>
  <text x="983" y="570" font-size="10.5">+suprimir(ref: str): bool</text>

  <rect x="1220" y="465" width="235" height="122" fill="#ffffff" stroke="#9f1239" stroke-width="1.6"/>
  <line x1="1220" y1="493" x2="1455" y2="493" stroke="#9f1239"/><line x1="1220" y1="520" x2="1455" y2="520" stroke="#9f1239"/>
  <text x="1337" y="484" text-anchor="middle" font-size="12" font-weight="700">ProveedorBiometricoSimulado</text>
  <text x="1228" y="510" font-size="10.5">-modoPrueba: bool</text>
  <text x="1228" y="538" font-size="10.5">+enrolar(muestra: bytes): str</text>
  <text x="1228" y="554" font-size="10.5">+cotejar(m: bytes, ref: str): bool</text>
  <text x="1228" y="570" font-size="10.5">+suprimir(ref: str): bool</text>

  <!-- Patron Strategy 2: ExportadorReporte -->
  <rect x="630" y="530" width="320" height="86" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="630" y1="570" x2="950" y2="570" stroke="#1d4ed8"/>
  <text x="790" y="548" text-anchor="middle" font-size="10.5" fill="#1d4ed8">&lt;&lt;interface · Strategy&gt;&gt;</text>
  <text x="790" y="564" text-anchor="middle" font-size="13" font-weight="700">ExportadorReporte</text>
  <text x="640" y="592" font-size="10.5">+generar(datos: list, idSesion: int): bytes</text>

  <rect x="575" y="680" width="205" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="575" y1="708" x2="780" y2="708" stroke="#1d4ed8"/>
  <text x="677" y="699" text-anchor="middle" font-size="12" font-weight="700">ExportadorPDF</text>
  <text x="583" y="730" font-size="10.5">+generar(datos: list, idS: int): bytes</text>

  <rect x="800" y="680" width="205" height="72" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="800" y1="708" x2="1005" y2="708" stroke="#1d4ed8"/>
  <text x="902" y="699" text-anchor="middle" font-size="12" font-weight="700">ExportadorXLSX</text>
  <text x="808" y="730" font-size="10.5">+generar(datos: list, idS: int): bytes</text>

  <!-- Relaciones -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <!-- Herencia Aprendiz / Instructor -> Usuario -->
    <polyline points="152,255 152,226 162,226 162,207" marker-end="url(#inh)"/>
    <polyline points="432,255 432,226 162,226"/>
    <!-- Agregacion Ficha o-> Aprendiz -->
    <polyline points="315,155 294,155 294,312 277,312" marker-start="url(#agg)"/>
    <!-- Instructor 1 -> 0..* Ficha -->
    <line x1="437" y1="255" x2="437" y2="196" marker-end="url(#arr)"/>
    <!-- Ficha 1 -> 0..* SesionFormacion -->
    <line x1="560" y1="120" x2="630" y2="120" marker-end="url(#arr)"/>
    <!-- Composicion SesionFormacion *-> TokenQR -->
    <line x1="885" y1="120" x2="960" y2="120" marker-start="url(#comp)" marker-end="url(#arr)"/>
    <!-- Aprendiz -> RegistroAsistencia & Excusa -->
    <line x1="152" y1="373" x2="152" y2="470" marker-end="url(#arr)"/>
    <polyline points="30,312 14,312 14,710 30,710" marker-end="url(#arr)"/>
    <!-- SesionFormacion 1 -> 0..* RegistroAsistencia, Incidencia, Excusa -->
    <polyline points="630,175 595,175 595,442 215,442 215,470" marker-end="url(#arr)"/>
    <polyline points="595,442 442,442 442,470" marker-end="url(#arr)"/>
    <polyline points="215,442 295,442 295,710 280,710" marker-end="url(#arr)"/>
    <!-- Fachada relaciones -->
    <line x1="965" y1="320" x2="1030" y2="320" marker-end="url(#arr)"/>
    <line x1="790" y1="405" x2="790" y2="530" marker-end="url(#arr)"/>
    <line x1="757" y1="275" x2="757" y2="196" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <polyline points="630,388 585,388 585,425 480,425 480,470" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <polyline points="585,425 180,425 180,470" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <!-- Implementaciones Strategy -->
    <polyline points="1087,465 1087,420 1230,420 1230,382" stroke-dasharray="5,3" marker-end="url(#inh)"/>
    <polyline points="1337,465 1337,420 1230,420" stroke-dasharray="5,3"/>
    <polyline points="677,680 677,646 790,646 790,618" stroke-dasharray="5,3" marker-end="url(#inh)"/>
    <polyline points="902,680 902,646 790,646" stroke-dasharray="5,3"/>
  </g>
  <!-- Multiplicidades -->
  <g font-size="10.5" font-weight="700" fill="#0f172a">
    <text x="300" y="146">1</text><text x="278" y="302">0..*</text>
    <text x="444" y="246">1</text><text x="444" y="210">0..*</text>
    <text x="570" y="112">1</text><text x="608" y="112">0..*</text>
    <text x="900" y="112">1</text><text x="938" y="112">1..*</text>
    <text x="132" y="390">1</text><text x="132" y="460">0..*</text>
    <text x="612" y="168">1</text><text x="222" y="462">0..*</text><text x="450" y="462">0..*</text>
  </g>
</svg>

